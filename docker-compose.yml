services:



  nginx:

    build:

      context: ./nginx

      dockerfile: Dockerfile

    container_name: nginx-container

    ports:

      - "80:80"

    depends_on:

      - frontend

      - backend



  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    container_name: frontend-container



  backend:

    build:

      context: .

      dockerfile: backend/Dockerfile

    container_name: backend-container

    healthcheck:

      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/ping"]

      interval: 30s

      timeout: 10s

      retries: 3

